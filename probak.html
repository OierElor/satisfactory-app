<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probak — Fabrika Kudeatzailea</title>
<style>
  :root {
    --bg-deep: #0a0c0e; --bg-panel: #111418; --border: #2a3340;
    --accent: #E8A838; --green: #3FE88A; --red: #E85555;
    --text-primary: #e8edf2; --text-secondary: #7a8fa0; --text-muted: #3d5068;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
  }
  body { background: var(--bg-deep); color: var(--text-secondary); font-family: var(--mono); padding: 2rem; line-height: 1.6; }
  h1 { color: var(--accent); font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  .azpititulua { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #laburpena { padding: 12px 16px; border: 1px solid var(--border); background: var(--bg-panel); margin-bottom: 20px; font-size: 15px; }
  .ondo { color: var(--green); }
  .gaizki { color: var(--red); }
  ul { list-style: none; }
  li { padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .mezua { color: var(--red); padding-left: 24px; font-size: 12px; white-space: pre-wrap; }
  .oharra { margin-top: 24px; color: var(--text-muted); font-size: 12px; max-width: 70ch; }
</style>
</head>
<body>
<h1>Probak</h1>
<div class="azpititulua">Datu-geruzaren egiaztapena — biltegia, balioztatzea eta inportazioa</div>
<div id="laburpena">Exekutatzen…</div>
<ul id="zerrenda"></ul>
<div class="oharra">
  Probek beren datuak erabiltzen dituzte eta amaitzean garbitu egiten dute.
  Hala ere, jatorri bera partekatzen dutenez, ez exekutatu datu errealak
  dituzun fitxa berean lanean ari zarela: esportatu lehenik.
</div>

<script src="js/balioztatu.js"></script>
<script src="js/biltegia.js"></script>
<script src="js/api.js"></script>
<script src="js/kopiak.js"></script>
<script src="js/probak.js"></script>
<script>
/* `esk()` interfazearen fitxategian dago (index.html); hemen kopiatzen dugu
   proba bakarrarentzat, orri osoa kargatu beharrik ez izateko. */
function esk(testua) {
  return String(testua == null ? '' : testua).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

(async () => {
  const zerrenda = document.getElementById('zerrenda');
  const emaitza = await probakExekutatu((ondo, izena, mezua) => {
    const li = document.createElement('li');
    li.innerHTML = ondo
      ? '<span class="ondo">✓</span> ' + esk(izena)
      : '<span class="gaizki">✗</span> ' + esk(izena) + '<div class="mezua">' + esk(mezua) + '</div>';
    zerrenda.appendChild(li);
  });

  const laburpena = document.getElementById('laburpena');
  laburpena.className = emaitza.akatsak.length ? 'gaizki' : 'ondo';
  laburpena.textContent = emaitza.akatsak.length
    ? emaitza.akatsak.length + ' akats / ' + emaitza.guztira + ' proba'
    : emaitza.guztira + ' proba, guztiak ondo';
})();
</script>
</body>
</html>
